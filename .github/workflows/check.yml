name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv sync --locked --group=check
      - run: python scripts/export_environment.py --check
      - run: uv run ruff check --no-fix scripts
      - run: uv run ruff format --check scripts
      - run: uv run mypy scripts
      - run: uv run just check-code
      - run: uv run just check-type
      - run: uv run just check-format
      - run: uv run just check-security
      - run: uv run just check-coverage

  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install locked build environment
        run: uv sync --locked --no-default-groups
      - name: Build wheel with installed build backend
        run: uv build --wheel --no-build-isolation --out-dir "$RUNNER_TEMP/wheel-dist"
      - name: Install wheel in a fresh runtime environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.13 "$RUNNER_TEMP/wheel-env"
          uv pip sync --python "$RUNNER_TEMP/wheel-env/bin/python" requirements.txt
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" --no-deps "$RUNNER_TEMP"/wheel-dist/*.whl
          uv pip check --python "$RUNNER_TEMP/wheel-env/bin/python"
      - name: Verify installed CLI and model lifecycle outside checkout
        run: '"$RUNNER_TEMP/wheel-env/bin/python" -I scripts/smoke_wheel.py'

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build wheel from locked environment
        run: |
          uv sync --locked --no-default-groups
          python scripts/export_environment.py --check
          uv build --wheel --no-build-isolation
      - name: Build package container
        run: docker build --tag bikes-ci .
      - name: Check default container command
        run: docker run --rm --network none bikes-ci
      - name: Prepare smoke fixtures without package sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-fixture/scripts" "$RUNNER_TEMP/container-fixture/data"
          cp pyproject.toml "$RUNNER_TEMP/container-fixture/"
          cp scripts/smoke_wheel.py "$RUNNER_TEMP/container-fixture/scripts/"
          cp data/inputs_train.parquet data/targets_train.parquet "$RUNNER_TEMP/container-fixture/data/"
      - name: Run container lifecycle with networking disabled
        shell: bash
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$RUNNER_TEMP/container-fixture,target=/fixture,readonly" \
            bikes-ci python -I /fixture/scripts/smoke_wheel.py
