name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv sync --locked --group=check
      - run: python scripts/export_environment.py --check
      - run: uv run ruff check --no-fix scripts
      - run: uv run ruff format --check scripts
      - run: uv run mypy scripts
      - run: uv run just check-code
      - run: uv run just check-type
      - run: uv run just check-format
      - run: uv run just check-security
      - run: uv run just check-coverage
